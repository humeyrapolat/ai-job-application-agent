services:
  - type: web
    name: ai-job-application-agent-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: CORS_ALLOW_ORIGINS
        value: https://humeyrapolat.github.io,http://127.0.0.1:5173,http://localhost:5173
